name: McpCli Linux product checks
description: Reuse built outputs for package, conformance and the complete isolated native product lane.
runs:
  using: composite
  steps:
    - name: Stage and validate CI fixture packages and smoke consumers
      shell: bash
      run: timeout --signal=TERM --kill-after=30s 900 "${HEXALITH_CI_PYTHON:?Shared prepared Python is required}" scripts/product_ci.py linux-packages
    - name: Retain identical CI fixture packages for both platform jobs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mcpcli-product-packages
        path: ${{ runner.temp }}/mcpcli-product/staged/
        if-no-files-found: error
    - name: Prepare isolated native fixtures using shared environment tools
      shell: bash
      env:
        ASPIRE_EVIDENCE_PATH: TestResults/live-ci
      run: bash tools/live-topology/prepare-ci.sh
    - name: Execute shared-head boundary safety gate
      shell: bash
      env:
        ASPIRE_EVIDENCE_PATH: TestResults/live-ci
      run: timeout --signal=TERM --kill-after=30s 1500 python3 tools/live-topology/ci.py run-boundary
    - name: Validate conformance, enrolled modules and topology preflight
      shell: bash
      run: timeout --signal=TERM --kill-after=30s 3600 "${HEXALITH_CI_PYTHON:?Shared prepared Python is required}" scripts/product_ci.py linux-conformance
    - name: Execute remaining live vectors and independent smoke
      shell: bash
      env:
        ASPIRE_EVIDENCE_PATH: TestResults/live-ci
      run: timeout --signal=TERM --kill-after=30s 13800 python3 tools/live-topology/ci.py run-remaining
    - name: Retain product diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mcpcli-linux-product-diagnostics
        path: |
          ${{ runner.temp }}/mcpcli-product/diagnostics/
          ${{ runner.temp }}/mcpcli-product/linux/installed-tool/
          !${{ runner.temp }}/mcpcli-product/linux/installed-tool/private/**
          ${{ runner.temp }}/mcpcli-product/linux/consumer/build.log
          ${{ runner.temp }}/mcpcli-product/enrolled/
          ${{ runner.temp }}/mcpcli-product/preflight/
          TestResults/live-ci/
        if-no-files-found: warn
