name: Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Historical bootstrap verification, staging-only paired validation, or accepted paired publication
        required: true
        type: choice
        options: [bootstrap, stage-paired, paired]
      recovery_version:
        description: Fixed historical bootstrap version to verify (1.0.0, 1.1.0, 2.0.0); required for bootstrap
        required: false
        type: string
        default: ''
      staging_run_id:
        description: Exact successful stage-paired Release run to publish (paired phase only)
        required: false
        type: string
        default: ''
      operator_acceptance:
        description: Sanitized candidate-bound operator approval JSON (paired phase only; see release checklist)
        required: false
        type: string
        default: ''

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    if: ${{ inputs.phase != 'stage-paired' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Validate release request before production approval
        env:
          PHASE: ${{ inputs.phase }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-request.py --dispatch -- "$RECOVERY_VERSION" "$PHASE"
      - name: Initialize root-declared baseline for full current-main source verification
        run: git submodule update --init -- references/Hexalith.AI.Tools
      - name: Require current main with full paired gates and instruction prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: python3 scripts/verify-release-source.py --output "$RUNNER_TEMP/release-source.json" -- "$DISPATCH_SHA" "$DISPATCH_REF" paired

  publish:
    needs: verify-source
    if: ${{ inputs.phase == 'paired' && inputs.recovery_version == '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds references/Hexalith.AI.Tools
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned release tooling
        run: npm ci
      - name: Recheck source and independent results after production approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
          MCPCLI_RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: python3 scripts/verify-release-source.py --output "$RUNNER_TEMP/release-source.json" -- "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"
      - name: Authenticate the selected staging run and retain the explicit operator decision
        if: ${{ inputs.phase == 'paired' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          python3 scripts/verify-paired-publication.py fetch --repository "$REPOSITORY" \
            --staging-run "$MCPCLI_STAGING_RUN_ID" --source-sha "$DISPATCH_SHA" --candidate "$RUNNER_TEMP/paired-candidate"
          python3 scripts/verify-paired-publication.py record-operator --output "$RUNNER_TEMP/operator-acceptance.json"
      - name: Get short-lived NuGet publication key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jpiquot
      - name: Derive one version and publish the selected phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
          MCPCLI_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          MCPCLI_PAIRED_CANDIDATE: ${{ runner.temp }}/paired-candidate
          MCPCLI_OPERATOR_ACCEPTANCE: ${{ runner.temp }}/operator-acceptance.json
          MCPCLI_PAIRED_PREFLIGHT: ${{ runner.temp }}/paired-preflight.json
        run: npx --no-install semantic-release
      - name: Require both paired packages publicly verified
        if: ${{ inputs.phase == 'paired' }}
        env:
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path('nupkgs/paired-publication/outcome.json')
          outcome = json.loads(path.read_text()) if path.is_file() else {}
          valid = (outcome.get('status') == 'paired-public-verified'
                   and outcome.get('source_sha') == os.environ['DISPATCH_SHA']
                   and str(outcome.get('staging_run_id')) == os.environ['MCPCLI_STAGING_RUN_ID']
                   and set(outcome.get('packages', {})) == {'Hexalith.McpCli.Abstractions', 'Hexalith.McpCli'}
                   and all(item.get('status') == 'public-verified' for item in outcome['packages'].values()))
          receipt = {'status': 'passed' if valid else 'refused',
                     'reason': 'Both public packages verified' if valid else 'Paired publication produced no complete public-pair verification; no-release is not publication'}
          Path(os.environ['RUNNER_TEMP'], 'paired-publication-completion.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if not valid:
              raise SystemExit(receipt['reason'])
          PYTHON
      - name: Retain sanitized operator evidence on success or refusal
        if: ${{ always() && inputs.phase == 'paired' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          python3 scripts/verify-paired-publication.py retain-operator
          --input "$RUNNER_TEMP/operator-acceptance.json"
          --input nupkgs/paired/operator.json
          --output "$RUNNER_TEMP/retained-operator"
      - name: Retain paired publication success, refusal or partial outcomes
        if: ${{ always() && inputs.phase == 'paired' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-publication-outcomes
          path: |
            ${{ runner.temp }}/paired-preflight.json*
            ${{ runner.temp }}/paired-publication-completion.json
            ${{ runner.temp }}/release-source.json
            ${{ runner.temp }}/operator-acceptance.json.failure.json
            ${{ runner.temp }}/retained-operator/
            ${{ runner.temp }}/paired-candidate/
            nupkgs/paired/
            !nupkgs/paired/operator.json
            nupkgs/paired-publication/
          if-no-files-found: warn

  recover:
    needs: verify-source
    if: ${{ inputs.recovery_version != '' && inputs.phase == 'bootstrap' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared baseline for full current-main source verification
        run: git submodule update --init -- references/Hexalith.AI.Tools
      - name: Require current reviewed recovery workflow and independent gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: python3 scripts/verify-release-source.py --output "$RUNNER_TEMP/release-source.json" -- "$DISPATCH_SHA" "$DISPATCH_REF" paired
      - name: Preserve reviewed recovery scripts before checking out the release tag
        run: cp -a scripts "$RUNNER_TEMP/release-scripts"
      - name: Require an existing release tag on main
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          historical_sha="$(python3 "$RUNNER_TEMP/release-scripts/release-request.py" --historical-sha -- "$RECOVERY_VERSION" bootstrap)"
          if ! tagged_sha="$(git rev-parse --verify "refs/tags/v${RECOVERY_VERSION}^{commit}")"; then
            echo "Historical recovery tag does not exist." >&2
            exit 1
          fi
          if [ "$tagged_sha" != "$historical_sha" ]; then
            echo "Recovery tag does not match the fixed historical binding." >&2
            exit 1
          fi
          git checkout --detach "v${RECOVERY_VERSION}"
          git submodule update --init -- references/Hexalith.AI.Tools references/Hexalith.Builds
          python3 "$RUNNER_TEMP/release-scripts/verify-release-source.py" --tagged-recovery "$RECOVERY_VERSION" -- "$historical_sha" "$DISPATCH_REF" bootstrap
          printf 'DISPATCH_SHA=%s\n' "$historical_sha" >> "$GITHUB_ENV"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Rebuild and consumer-test the tagged package
        env:
          MCPCLI_RELEASE_PHASE: bootstrap
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: bash "$RUNNER_TEMP/release-scripts/release-prepare.sh" "$RECOVERY_VERSION"
      - name: Verify the already-public historical package without publication
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: refs/heads/main
        run: python3 "$RUNNER_TEMP/release-scripts/recover-bootstrap-release.py" -- "$RECOVERY_VERSION" bootstrap 2>&1 | tee "$RUNNER_TEMP/bootstrap-verification.txt"
      - name: Retain historical verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-bootstrap-verification
          path: |
            ${{ runner.temp }}/release-source.json
            ${{ runner.temp }}/bootstrap-verification.txt
            nupkgs/bootstrap.sha256
          if-no-files-found: warn

  stage-pair:
    if: ${{ inputs.phase == 'stage-paired' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Require staging dispatch from main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Refuse staging recovery
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: test -z "$RECOVERY_VERSION"
      - name: Initialize only the root-declared build and baseline dependencies
        run: git submodule update --init -- references/Hexalith.Builds references/Hexalith.AI.Tools
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Select a version using only a temporary local Git remote
        id: select
        run: |
          node scripts/select-release-version.mjs "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" "$GITHUB_OUTPUT" <<'PYTHON'
          import json, sys
          with open(sys.argv[2], 'a') as output:
              output.write('release=' + str(json.load(open(sys.argv[1]))['release']).lower() + '\n')
          PYTHON
      - name: Recheck full-v1 source gates and prepare exactly one pair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare-paired-release.py --selection "$RUNNER_TEMP/version.json" --output "$RUNNER_TEMP/paired"
      - name: Retain the sole staged pair or explicit no-release result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired/
          if-no-files-found: error
      - name: Retain failed preparation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-preparation-failure
          path: ${{ runner.temp }}/paired/
          if-no-files-found: warn

  smoke-pair:
    needs: stage-pair
    if: ${{ needs.stage-pair.outputs.release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Enable long paths on the Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared Builds for required platform tests
        run: git submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired
      - name: Install the same local tool bytes and run offline smoke
        shell: bash
        run: |
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
          "$python_command" scripts/smoke-paired-tool.py --staging "$RUNNER_TEMP/paired/packages" --prepared "$RUNNER_TEMP/paired/prepared.json" --output "$RUNNER_TEMP/consumer/smoke"
      - name: Execute required Windows Core and CLI suites or macOS CLI suite
        shell: bash
        run: |
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
          "$python_command" scripts/run-paired-platform-tests.py --prepared "$RUNNER_TEMP/paired/prepared.json" --output "$RUNNER_TEMP/consumer/tests"
      - name: Retain actual platform receipts and raw captures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-consumer-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/consumer/
            !${{ runner.temp }}/consumer/smoke/private/
            !${{ runner.temp }}/consumer/tests/home/
          if-no-files-found: error

  accept-staged-pair:
    needs: [stage-pair, smoke-pair]
    if: ${{ needs.stage-pair.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared baseline for fresh acceptance checks
        run: git submodule update --init -- references/Hexalith.AI.Tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: paired-consumer-*
          path: ${{ runner.temp }}/consumers
      - name: Require source still eligible after platform execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: python3 scripts/verify-release-source.py --staging --output "$RUNNER_TEMP/acceptance-source.json" "$DISPATCH_SHA" refs/heads/main paired
      - name: Require every receipt, named Windows test and identical raw discovery bytes
        run: >-
          python3 scripts/compare-paired-evidence.py
          --staging "$RUNNER_TEMP/paired/packages" --prepared "$RUNNER_TEMP/paired/prepared.json"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-ubuntu-latest"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-windows-latest"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-macos-latest"
          --output "$RUNNER_TEMP/accepted-pair.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-staging-only
          path: |
            ${{ runner.temp }}/accepted-pair.json
            ${{ runner.temp }}/acceptance-source.json
          if-no-files-found: error
