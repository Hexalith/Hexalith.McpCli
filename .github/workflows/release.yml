name: Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bootstrap publication, staging-only paired validation, or refused paired publication
        required: true
        type: choice
        options: [bootstrap, stage-paired, paired]
      recovery_version:
        description: Existing partial-release version to recover, for example 1.0.0; leave blank for a new release
        required: false
        type: string
        default: ''

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    if: ${{ inputs.phase != 'stage-paired' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
      - name: Require current main with exact-source bootstrap and commitlint success
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: python3 scripts/verify-release-source.py -- "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"

  publish:
    needs: verify-source
    if: ${{ inputs.recovery_version == '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned release tooling
        run: npm ci
      - name: Recheck source and independent results after production approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: python3 scripts/verify-release-source.py -- "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"
      - name: Get short-lived NuGet publication key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jpiquot
      - name: Derive one version and publish the selected phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: npx --no-install semantic-release

  recover:
    needs: verify-source
    if: ${{ inputs.recovery_version != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Require current reviewed recovery workflow and independent gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: python3 scripts/verify-release-source.py -- "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"
      - name: Preserve reviewed recovery scripts before checking out the release tag
        run: cp -a scripts "$RUNNER_TEMP/release-scripts"
      - name: Require an existing release tag on main
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          RECOVERY_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          python3 scripts/release-request.py -- "$RECOVERY_VERSION" "$RECOVERY_PHASE"
          if ! git rev-parse -q --verify "refs/tags/v${RECOVERY_VERSION}^{commit}" >/dev/null; then
            echo "Tag v${RECOVERY_VERSION} does not exist; run a new release instead." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "v${RECOVERY_VERSION}" origin/main; then
            echo "Tag v${RECOVERY_VERSION} is not on main." >&2
            exit 1
          fi
          git checkout --detach "v${RECOVERY_VERSION}"
          printf 'DISPATCH_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Rebuild and consumer-test the tagged package
        env:
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: bash "$RUNNER_TEMP/release-scripts/release-prepare.sh" "$RECOVERY_VERSION"
      - name: Get short-lived NuGet publication key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jpiquot
      - name: Publish only if absent and verify the public package
        env:
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: refs/heads/main
        run: python3 "$RUNNER_TEMP/release-scripts/recover-bootstrap-release.py" -- "$RECOVERY_VERSION" "$MCPCLI_RELEASE_PHASE"
      - name: Complete the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: refs/heads/main
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/release-scripts/verify-release-source.py" --tagged-recovery "$RECOVERY_VERSION" -- "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"
          tag="v${RECOVERY_VERSION}"
          if release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            gh release upload "$tag" nupkgs/bootstrap/*.nupkg --clobber
            if [ "$release_is_draft" = true ]; then
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" nupkgs/bootstrap/*.nupkg --verify-tag --title "$tag" --generate-notes
          fi

  stage-pair:
    if: ${{ inputs.phase == 'stage-paired' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Refuse staging recovery
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: test -z "$RECOVERY_VERSION"
      - name: Initialize only the root-declared build and baseline dependencies
        run: git submodule update --init -- references/Hexalith.Builds references/Hexalith.AI.Tools
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Select a version using only a temporary local Git remote
        id: select
        run: |
          node scripts/select-release-version.mjs "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" "$GITHUB_OUTPUT" <<'PYTHON'
          import json, sys
          with open(sys.argv[2], 'a') as output:
              output.write('release=' + str(json.load(open(sys.argv[1]))['release']).lower() + '\n')
          PYTHON
      - name: Recheck full-v1 source gates and prepare exactly one pair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare-paired-release.py --selection "$RUNNER_TEMP/version.json" --output "$RUNNER_TEMP/paired"
      - name: Retain the sole staged pair or explicit no-release result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired/
          if-no-files-found: error
      - name: Retain failed preparation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-preparation-failure
          path: ${{ runner.temp }}/paired/
          if-no-files-found: warn

  smoke-pair:
    needs: stage-pair
    if: ${{ needs.stage-pair.outputs.release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared Builds for required platform tests
        run: git submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired
      - name: Install the same local tool bytes and run offline smoke
        shell: bash
        run: |
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
          "$python_command" scripts/smoke-paired-tool.py --staging "$RUNNER_TEMP/paired/packages" --prepared "$RUNNER_TEMP/paired/prepared.json" --output "$RUNNER_TEMP/consumer/smoke"
      - name: Execute required Windows Core and CLI suites or macOS CLI suite
        shell: bash
        run: |
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
          "$python_command" scripts/run-paired-platform-tests.py --prepared "$RUNNER_TEMP/paired/prepared.json" --output "$RUNNER_TEMP/consumer/tests"
      - name: Retain actual platform receipts and raw captures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-consumer-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/consumer/
            !${{ runner.temp }}/consumer/smoke/private/
            !${{ runner.temp }}/consumer/tests/home/
          if-no-files-found: error

  accept-staged-pair:
    needs: [stage-pair, smoke-pair]
    if: ${{ needs.stage-pair.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize root-declared baseline for fresh acceptance checks
        run: git submodule update --init -- references/Hexalith.AI.Tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: paired-preparation
          path: ${{ runner.temp }}/paired
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: paired-consumer-*
          path: ${{ runner.temp }}/consumers
      - name: Require source still eligible after platform execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: python3 scripts/verify-release-source.py --staging --output "$RUNNER_TEMP/acceptance-source.json" "$DISPATCH_SHA" refs/heads/main paired
      - name: Require every receipt, named Windows test and identical raw discovery bytes
        run: >-
          python3 scripts/compare-paired-evidence.py
          --staging "$RUNNER_TEMP/paired/packages" --prepared "$RUNNER_TEMP/paired/prepared.json"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-ubuntu-latest"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-windows-latest"
          --consumer "$RUNNER_TEMP/consumers/paired-consumer-macos-latest"
          --output "$RUNNER_TEMP/accepted-pair.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-staging-only
          path: |
            ${{ runner.temp }}/accepted-pair.json
            ${{ runner.temp }}/acceptance-source.json
          if-no-files-found: error
