name: Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bootstrap Abstractions or publish the later paired tool release
        required: true
        type: choice
        options: [bootstrap, paired]

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
      - name: Require current main with exact-source bootstrap and commitlint success
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: python3 scripts/verify-release-source.py "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"

  publish:
    needs: verify-source
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned release tooling
        run: npm ci
      - name: Recheck source and independent results after production approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: python3 scripts/verify-release-source.py "$DISPATCH_SHA" "$DISPATCH_REF" "$MCPCLI_RELEASE_PHASE"
      - name: Derive one version and publish the selected phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          MCPCLI_RELEASE_PHASE: ${{ inputs.phase }}
        run: npx --no-install semantic-release
