name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@main
    with:
      solution: Hexalith.McpCli.slnx
      test-platform: microsoft-testing-platform
      unit-test-projects: |
        tests/Hexalith.McpCli.Abstractions.Tests
        tests/Hexalith.McpCli.Analyzers.Tests
        tests/Hexalith.McpCli.Core.Tests
        tests/Hexalith.McpCli.Manifest.Tests
        tests/Hexalith.McpCli.Cli.Tests
        tests/Hexalith.McpCli.Mcp.Tests
      # Add the blocking Aspire tier after the harness and upstream source-build seam exist.

  conformance-vector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack and validate the shared vector contract without a Head or Gateway
        run: |
          python3 -m venv "$RUNNER_TEMP/mcpcli-vector-venv"
          source "$RUNNER_TEMP/mcpcli-vector-venv/bin/activate"
          python3 -m pip install -r tools/conformance-vectors/v1/requirements.txt
          bash tools/conformance-vectors/v1/run-sample-validation.sh Release

  conformance-vector-loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install vector runner test tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/mcpcli-vector-venv"
          "$RUNNER_TEMP/mcpcli-vector-venv/bin/python" -m pip install -r tools/conformance-vectors/v1/requirements.txt
      - name: Run packaged Contracts through CLI and MCP against reset Gateway replay
        run: |
          source "$RUNNER_TEMP/mcpcli-vector-venv/bin/activate"
          bash tools/conformance-vectors/v1/run-sample-loopback.sh

  enrolled-module-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build exact production catalog
        run: |
          dotnet restore Hexalith.McpCli.slnx
          dotnet build Hexalith.McpCli.slnx --no-restore --configuration Release -warnaserror
          dotnet tests/Hexalith.McpCli.Core.Tests/bin/Release/net10.0/Hexalith.McpCli.Core.Tests.dll -class Hexalith.McpCli.Core.Tests.EnrolledModuleCoverageTests
      - name: Benchmark first v1 Catalog construction in a fresh process
        env:
          MCPCLI_BENCHMARK_REQUIRE_V1: 'true'
          MCPCLI_BENCHMARK_OUTPUT: ${{ runner.temp }}/enrolled-evidence/catalog-benchmark.json
        run: dotnet tests/Hexalith.McpCli.Core.Tests/bin/Release/net10.0/Hexalith.McpCli.Core.Tests.dll -class Hexalith.McpCli.Core.Tests.CatalogPerformanceTests
      - name: Validate approved artifacts, complete vectors and both heads
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/mcpcli-enrolled-venv"
          source "$RUNNER_TEMP/mcpcli-enrolled-venv/bin/activate"
          python3 -m pip install -r tools/conformance-vectors/v1/requirements.txt
          python3 -m unittest discover -v -s tools/conformance-vectors/v1 -p 'test_*.py'
          python3 tools/conformance-vectors/v1/check_enrolled.py --output "$RUNNER_TEMP/enrolled-evidence"
      - name: Retain enrolled-module receipts, inputs and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrolled-module-evidence
          path: ${{ runner.temp }}/enrolled-evidence/
          if-no-files-found: warn

  topology-smoke-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and discover the live smoke without starting source services
        run: |
          python3 -m unittest discover -v -s tools/live-topology -p 'test_*.py'
          dotnet restore tests/Hexalith.McpCli.Integration.Tests/Hexalith.McpCli.Integration.Tests.csproj
          dotnet build tests/Hexalith.McpCli.Integration.Tests/Hexalith.McpCli.Integration.Tests.csproj --no-restore --configuration Release -warnaserror
          dotnet tests/Hexalith.McpCli.Integration.Tests/bin/Release/net10.0/Hexalith.McpCli.Integration.Tests.dll -list tests > "$RUNNER_TEMP/topology-smoke-discovery.txt"
          python3 - "$RUNNER_TEMP/topology-smoke-discovery.txt" <<'PYTHON'
          import pathlib, sys
          discovered = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
                        if line.startswith("Hexalith.McpCli.Integration.Tests.")]
          expected = ["Hexalith.McpCli.Integration.Tests.GatewaySmokeTests.AuthenticatedQueryReturnsSuccessfulDocument"]
          if discovered != expected:
              raise SystemExit(f"Expected exactly the live Gateway smoke; discovered {discovered!r}")
          print(discovered[0])
          PYTHON
