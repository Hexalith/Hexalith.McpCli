name: Bootstrap package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize root-declared Builds submodule
        run: git submodule update --init -- references/Hexalith.Builds
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up pinned release-test Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned release tooling
        run: npm ci
      - name: Verify detached-source version selection with real local Git history
        env:
          MCPCLI_VERSION_TEST_EVIDENCE: ${{ runner.temp }}/release-version-tests
        run: node --test scripts/tests/select-release-version.test.mjs
      - name: Retain fixture commit validation and complete source-ref evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-version-regression
          path: ${{ runner.temp }}/release-version-tests/
          if-no-files-found: error
      - name: Verify release rejection and source gates without publication
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and run author-time tests independently of the tool
        run: |
          for project in Abstractions Analyzers; do
            test_project="tests/Hexalith.McpCli.${project}.Tests"
            dotnet restore "$test_project"
            dotnet build "$test_project" --configuration Release --no-restore -warnaserror
            dotnet test "$test_project" --configuration Release --no-build
          done
      - name: Prepare and validate only the bootstrap production projects
        env:
          MCPCLI_RELEASE_PHASE: bootstrap
        run: bash scripts/release-prepare.sh 1.0.0
